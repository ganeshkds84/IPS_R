# Academic PDF collection: every PDF under `directory` is parsed into a structured document.
#   ips-r prepare dataset=academic_pdf dataset.params.directory=/papers chunker=sentence
name: academic_pdf
params:
  directory: ${paths.data}/raw/academic_pdf
  glob: "**/*.pdf"
  id_strategy: stem         # stem | relative_path
  questions_path: null      # optional JSON lines: {id, question, answers?, document_ids?}
  split: null
  version: null
  max_documents: null
  max_questions: null
  strict: false
  parser:
    backend: pdfplumber     # name in ips_r.data.pdf.PDF_BACKENDS
    backend_options:
      x_tolerance: 3
      y_tolerance: 3
      extract_tables: true
    layout:                 # ips_r.data.pdf.LayoutSettings (lengths in PDF points)
      line_tolerance: 2.0
      column_gap: 12.0
      detect_columns: true
      heading_size_ratio: 1.15
      title_size_ratio: 1.3
      title_search_lines: 15
      max_heading_words: 15
      max_numbered_heading_words: 8
      paragraph_gap_ratio: 1.4
      drop_page_numbers: true
    metadata:               # ips_r.data.pdf.MetadataSettings
      prefer_info_title: false
      use_creation_date_year: true
      min_year: 1900
      max_year: 2100
      language_min_tokens: 20
      language_min_ratio: 0.05
