# Primary Hydra config. Compose with:  ips-r config [overrides...]
#
# Component groups default to `none` (disabled). Select an implementation with
# `<group>=<impl>`, e.g. `dataset=squad chunker=recursive_character`.
defaults:
  - base_config            # structured schema (ips_r.config.schema.AppConfig)
  - paths: default
  - logging: default
  - seed: default
  - preparation: default
  - dataset: none
  - chunker: none
  - retriever: none
  - candidate_generator: none
  - decision_policy: none
  - reranker: none
  - generator: none
  - evaluator: none
  - pipeline: none
  - _self_
  - experiment: null       # optional preset, e.g. `experiment=example`

experiment:
  name: default
  description: ""
  tags: []

run:
  output_dir: null         # null -> ${paths.outputs}/<experiment.name>/<run_id>
  dry_run: false
